services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pulseops-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      REDIS_URL: redis://redis:6379
      MONGODB_LOCAL_URI: mongodb://mongodb:27017/pulseops
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the API container}
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8.0
    container_name: pulseops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - pulseops-mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pulseops-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pulseops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - pulseops-prometheus-data:/prometheus
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    container_name: pulseops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pulseops-grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pulseops-mongodb-data:
  pulseops-redis-data:
  pulseops-prometheus-data:
  pulseops-grafana-data: