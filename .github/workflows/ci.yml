name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @pulseops/api... build
      - name: Run tests
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          MONGODB_URI: mongodb://127.0.0.1:27017/pulseops-test
          JWT_SECRET: ci-test-secret
        run: pnpm test
      - run: pnpm build
      - name: Validate Docker Compose configuration
        env:
          JWT_SECRET: ci-compose-validation-only
        run: docker compose config --quiet
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t pulseops-api:ci .
